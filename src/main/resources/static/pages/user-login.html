<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Seeker Login</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<nav>
    <div class="brand">💼 Online Job Portal</div>
    <div><a href="../index.html">Home</a></div>
</nav>
<div class="container" style="max-width:420px;">
    <div class="card">
        <h2>Job Seeker Login</h2>
        <form id="loginForm">
            <div class="field"><label>Email</label><input type="email" id="email" required></div>
            <div class="field"><label>Password</label><input type="password" id="password" required></div>
            <button type="submit">Login</button>
        </form>
        <div id="msg" class="msg hidden"></div>
        <p style="margin-top:14px;font-size:13px;">New here? <a href="user-register.html">Register</a></p>
    </div>
</div>
<script src="../js/api.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msg');
    try {
        const res = await apiPost('/auth/login/user', {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        });
        if (res.success) {
            saveSession({ role: 'USER', id: res.id, name: res.name });
            window.location.href = 'jobseeker-dashboard.html';
        } else {
            showMsg(msg, res.message, 'error');
        }
    } catch (err) {
        showMsg(msg, err.message, 'error');
    }
});
</script>
</body>
</html>
