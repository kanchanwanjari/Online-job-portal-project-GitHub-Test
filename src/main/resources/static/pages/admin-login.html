<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<nav>
    <div class="brand">💼 Online Job Portal</div>
    <div><a href="../index.html">Home</a></div>
</nav>
<div class="container" style="max-width:420px;">
    <div class="card">
        <h2>Admin Login</h2>
        <form id="loginForm">
            <div class="field"><label>Username</label><input type="text" id="username" required></div>
            <div class="field"><label>Password</label><input type="password" id="password" required></div>
            <button type="submit">Login</button>
        </form>
        <div id="msg" class="msg hidden"></div>
        <p style="margin-top:14px;font-size:12px;color:#888;">Default admin: <b>admin</b> / <b>admin123</b> (created automatically on first run)</p>
    </div>
</div>
<script src="../js/api.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msg');
    try {
        const res = await apiPost('/auth/login/admin', {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
        });
        if (res.success) {
            saveSession({ role: 'ADMIN', id: res.id, name: res.name });
            window.location.href = 'admin-dashboard.html';
        } else {
            showMsg(msg, res.message, 'error');
        }
    } catch (err) {
        showMsg(msg, err.message, 'error');
    }
});
</script>
</body>
</html>
