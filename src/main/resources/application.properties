# ==========================================
# Online Job Portal System - Configuration
# ==========================================

# Server
server.port=8080

# ---- MySQL Database ----
# Change username/password below to match your local MySQL installation.
spring.datasource.url=jdbc:mysql://localhost:3306/job_portal_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# update: creates/updates tables automatically from the entity classes on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Jackson (avoid errors when JPA lazy proxies are serialized to JSON) ----
spring.jackson.serialization.fail-on-empty-beans=false
